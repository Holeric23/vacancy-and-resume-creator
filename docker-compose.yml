version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: ops/docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    environment:
      - NODE_ENV=production

  api:
    image: alpine:latest
    command: echo "Бэкенд-сервер еще не создан. База данных PostgreSQL готова к подключению."
    # В дальнейшем здесь будет реальный контейнер бэкенда:
    # build:
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    # ports:
    #   - "3000:3000"
    # depends_on:
    #   - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: creator_admin
      POSTGRES_PASSWORD: secure_dev_password
      POSTGRES_DB: creator_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: